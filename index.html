    <script>
        // ================================================================
        //  1. FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBurp3M6C4sgDIUX7H6eEGCAep9oBt24ss",
            authDomain: "aiclassdemo.firebaseapp.com",
            projectId: "aiclassdemo",
            databaseURL: "https://aiclassdemo-default-rtdb.firebaseio.com",
            storageBucket: "aiclassdemo.firebasestorage.app",
            messagingSenderId: "851078707703",
            appId: "1:851078707703:web:656731ca0310ba878e56f2",
            measurementId: "G-R57HXZ4EK4"
        };

        console.log('🔥 Firebase config loaded.');

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase initialized successfully.');
        } catch (err) {
            console.error('❌ Firebase init error:', err);
            alert('Firebase initialization failed: ' + err.message);
        }

        const auth = firebase.auth();
        const db = firebase.database();

        // Check if auth is ready
        auth.onAuthStateChanged((user) => {
            console.log('🔄 Auth state changed:', user ? user.email : 'null');
        });

        // ================================================================
        //  2. DOM REFS
        // ================================================================
        const loginOverlay = document.getElementById('loginOverlay');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginMsg = document.getElementById('loginMsg');
        const signupEmail = document.getElementById('signupEmail');
        const signupPassword = document.getElementById('signupPassword');
        const signupBranch = document.getElementById('signupBranch');
        const signupSemester = document.getElementById('signupSemester');
        const signupRole = document.getElementById('signupRole');
        const signupBtn = document.getElementById('signupBtn');
        const signupMsg = document.getElementById('signupMsg');
        const showSignup = document.getElementById('showSignup');
        const showLogin = document.getElementById('showLogin');
        const appContainer = document.getElementById('appContainer');
        const sidebar = document.getElementById('sidebar');
        const dynamicContent = document.getElementById('dynamicContent');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const roleBadge = document.getElementById('roleBadge');
        const avatarLetter = document.getElementById('avatarLetter');

        let currentUser = null;
        let currentRole = null;
        let currentBranch = null;
        let currentSemester = null;

        // ================================================================
        //  3. AUTH LISTENERS (with debug)
        // ================================================================
        showSignup.addEventListener('click', () => {
            console.log('Show signup form');
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            loginMsg.textContent = '';
            signupMsg.textContent = '';
        });
        showLogin.addEventListener('click', () => {
            console.log('Show login form');
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            loginMsg.textContent = '';
            signupMsg.textContent = '';
        });

        // --- Login ---
        loginBtn.addEventListener('click', async () => {
            console.log('Login button clicked');
            const email = loginEmail.value.trim();
            const pass = loginPassword.value.trim();
            if (!email || !pass) {
                loginMsg.textContent = 'Please enter email and password.';
                return;
            }
            loginMsg.textContent = '⏳ Signing in...';
            loginMsg.style.color = 'rgba(255,255,255,0.5)';
            try {
                console.log('Attempting signInWithEmailAndPassword...');
                await auth.signInWithEmailAndPassword(email, pass);
                console.log('Sign-in successful (should redirect via listener)');
            } catch (err) {
                console.error('Login error:', err);
                loginMsg.textContent = '❌ ' + err.message;
                loginMsg.style.color = '#f87171';
                alert('Login failed: ' + err.message);
            }
        });

        // --- Signup ---
        signupBtn.addEventListener('click', async () => {
            console.log('Signup button clicked');
            const email = signupEmail.value.trim();
            const pass = signupPassword.value.trim();
            const role = signupRole.value;

        function compareImagesBase64(base64_1, base64_2) {
            return new Promise((resolve) => {
                const img1 = new Image();
                const img2 = new Image();
                let loaded = 0;

                function checkDone() {
                    loaded++;
                    if (loaded === 2) {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const size = 80;
                        canvas.width = size;
                        canvas.height = size;
                        ctx.drawImage(img1, 0, 0, size, size);
                        const data1 = ctx.getImageData(0, 0, size, size).data;
                        ctx.drawImage(img2, 0, 0, size, size);
                        const data2 = ctx.getImageData(0, 0, size, size).data;
                        let mse = 0;
                        for (let i = 0; i < data1.length; i++) {
                            mse += (data1[i] - data2[i]) ** 2;
                        }
                        mse = mse / (data1.length);
                        const similarity = Math.max(0, (1 - Math.sqrt(mse) / 255) * 100);
                        resolve(similarity);
                    }
                }
                img1.onload = checkDone;
                img2.onload = checkDone;
                img1.onerror = () => { resolve(0); };
                img2.onerror = () => { resolve(0); };
                img1.src = base64_1;
                img2.src = base64_2;
            });
        }

            function loadClasses() {

                                        <button class="btn btn-danger btn-sm endClassBtn" data-key="${key}" data-name="${cls.className}" ${!isActive ? 'style="display:none;"' : ''}>End</button>
                                        <button class="btn btn-danger btn-sm deleteClassBtn" data-key="${key}" style="background:rgba(248,113,113,0.2);color:#f87171;border:1px solid rgba(248,113,113,0.2);">Delete</button>
                                    </div>
                                </div>
                            `;
                        });
                        classListContainer.innerHTML = html;

                        document.querySelectorAll('.startClassBtn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                const key = btn.dataset.key;
                                const name = btn.dataset.name;
                                await startClass(key, name);
                            });
                        });
                        document.querySelectorAll('.endClassBtn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                const key = btn.dataset.key;
                                await endClass(key);
                            });
                        });
                        document.querySelectorAll('.deleteClassBtn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                if (confirm('Delete this class?')) {
                                    await classesRef.child(btn.dataset.key).remove();
                                }
                            });
                        });
                    } else {
                        classListContainer.innerHTML = '<div class="text-muted">No classes created yet.</div>';
                    }
                });
            }
            loadClasses();

            createBtn.addEventListener('click', async () => {
                const branch = newBranch.value.trim();
                const semester = parseInt(newSemester.value);
                const subject = newSubject.value.trim();
                const className = newClassName.value.trim();
                if (!branch || !semester || !subject || !className) {
                    alert('Please fill all fields.');
                    return;
                }
                const snap = await classesRef.orderByChild('className').equalTo(className).once('value');
                if (snap.exists()) {
                    alert('A class with this name already exists.');
                    return;
                }
                const newRef = classesRef.push();
                await newRef.set({
                    branch,
                    semester,
                    subject,
                    className,
                    teacher: currentUser.uid,
                    createdAt: Date.now(),
                    active: false
                });
                newClassName.value = '';
                newSubject.value = '';
            });

            async function startClass(classKey, className) {
                if (isTeacherLive) {
                    await endClass(currentClassKey);
                }
                try {
                    if (peer) {
                        peer.destroy();
                        peer = null;
                    }
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    console.log('Got local stream');

                    peer = new Peer(className, { debug: 2 });
                    peer.on('open', (id) => {
                        console.log('PeerJS open, id:', id);
                        isTeacherLive = true;
                        currentClassKey = classKey;
                        classesRef.child(classKey).update({ active: true });
                        loadClasses();

                        liveContainer.innerHTML = `
                            <div class="card" style="margin-top:12px;">
                                <h3 style="font-size:17px;margin-bottom:8px;">🟢 Live: ${className}</h3>
                                <div class="video-wrapper" style="min-height:300px;position:relative;">
                                    <div id="videoContainer" style="width:100%;height:100%;background:#0a0f1a;display:flex;flex-wrap:wrap;gap:12px;padding:12px;overflow-y:auto;">
                                        <div class="local-player" style="width:40%;min-width:150px;height:40%;min-height:120px;"></div>
                                    </div>
                                    <div class="video-overlay-badge">
                                        <i class="fas fa-circle" style="color:#34d399;"></i>
                                        <span>Live (PeerJS)</span>
                                    </div>
                                </div>
                                <button id="stopLiveBtn" class="btn btn-danger" style="margin-top:10px;">Stop Class</button>
                            </div>
                        `;
                        const videoContainer = document.getElementById('videoContainer');
                        const localDiv = videoContainer.querySelector('.local-player');
                        const videoElement = document.createElement('video');
                        videoElement.srcObject = localStream;
                        videoElement.autoplay = true;
                        videoElement.muted = true;
                        videoElement.style.width = '100%';
                        videoElement.style.height = '100%';
                        videoElement.style.objectFit = 'cover';
                        localDiv.appendChild(videoElement);

                        peer.on('call', (call) => {
                            call.answer(localStream);
                            call.on('stream', (remoteStream) => {
                                const remoteDiv = document.createElement('div');
                                remoteDiv.className = 'remote-player';
                                videoContainer.appendChild(remoteDiv);
                                const remoteVideo = document.createElement('video');
                                remoteVideo.srcObject = remoteStream;
                                remoteVideo.autoplay = true;
                                remoteVideo.style.width = '100%';
                                remoteVideo.style.height = '100%';
                                remoteVideo.style.objectFit = 'cover';
                                remoteDiv.appendChild(remoteVideo);
                            });
                            call.on('close', () => {
                                const remoteDiv = videoContainer.querySelector('.remote-player');
                                if (remoteDiv) remoteDiv.remove();
                            });
                            currentCall = call;
                        });

                        document.getElementById('stopLiveBtn').addEventListener('click', () => {
                            endClass(classKey);
                        });
                    });

                    peer.on('error', (err) => {
                        console.error('PeerJS error:', err);
                        alert('PeerJS error: ' + err.message);
                        endClass(classKey);
                    });

                } catch (err) {
                    alert('Error starting class: ' + err.message);
                    console.error(err);
                }
            }

            async function endClass(classKey) {
                if (currentCall) {
                    currentCall.close();
                    currentCall = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
                isTeacherLive = false;
                liveContainer.innerHTML = '';
                await classesRef.child(classKey).update({ active: false });
                loadClasses();
                currentClassKey = null;
            }
        }

        function renderStudentLive() {
            dynamicContent.innerHTML = `
                <div class="page-content">
                    <h2>Live Class</h2>
                    <div id="studentClassList"></div>
                    <div id="studentLiveContainer"></div>
                </div>
            `;
            const classListDiv = document.getElementById('studentClassList');
            const liveContainer = document.getElementById('studentLiveContainer');

            const branch = currentBranch || '';
            const semester = currentSemester || 0;

            db.ref('classes').orderByChild('active').equalTo(true).on('value', (snap) => {
                classListDiv.innerHTML = '';
                if (snap.exists()) {
                    const classes = snap.val();
                    let found = false;
                    let html = '<div style="margin-bottom:12px;">Available Live Classes:</div>';
                    Object.keys(classes).forEach(key => {
                        const cls = classes[key];
                        if (cls.branch === branch && cls.semester === semester) {
                            found = true;
                            html += `
                                <div class="class-item" data-key="${key}">
                                    <span class="name">${cls.className} (${cls.subject})</span>
                                    <button class="btn btn-success btn-sm joinClassBtn" data-name="${cls.className}">Join</button>
                                </div>
                            `;
                        }
                    });
                    if (!found) {
                        html += '<div class="text-muted">No live classes for your branch & semester.</div>';
                    }
                    classListDiv.innerHTML = html;
                    document.querySelectorAll('.joinClassBtn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const name = btn.dataset.name;
                            await joinStudentClass(name);
                        });
                    });
                } else {
                    classListDiv.innerHTML = '<div class="text-muted">No live classes at the moment.</div>';
                }
            });

            let studentPeer = null;
            let studentCall = null;
            let studentStream = null;

            async function joinStudentClass(className) {
                if (studentCall) {
                    studentCall.close();
                    studentCall = null;
                    if (studentStream) {
                        studentStream.getTracks().forEach(t => t.stop());
                        studentStream = null;
                    }
                    if (studentPeer) {
                        studentPeer.destroy();
                        studentPeer = null;
                    }
                    liveContainer.innerHTML = '';
                    alert('Left class.');
                    return;
                }

                try {
                    studentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    studentPeer = new Peer();

                    studentPeer.on('open', (id) => {
                        const call = studentPeer.call(className, studentStream);
                        studentCall = call;

                        call.on('stream', (remoteStream) => {
                            liveContainer.innerHTML = `
                                <div class="card" style="margin-top:12px;">
                                    <h3 style="font-size:17px;margin-bottom:8px;">🟢 Joined: ${className}</h3>
                                    <div class="video-wrapper" style="min-height:300px;position:relative;">
                                        <div id="studentVideoContainer" style="width:100%;height:100%;background:#0a0f1a;display:flex;flex-wrap:wrap;gap:12px;padding:12px;overflow-y:auto;">
                                            <div class="local-player" style="width:40%;min-width:150px;height:40%;min-height:120px;"></div>
                                            <div class="remote-player" style="width:45%;min-width:180px;height:40%;min-height:120px;"></div>
                                        </div>
                                        <div class="video-overlay-badge">
                                            <i class="fas fa-circle" style="color:#34d399;"></i>
                                            <span>Connected</span>
                                        </div>
                                    </div>
                                    <button id="leaveClassBtn" class="btn btn-danger" style="margin-top:10px;">Leave Class</button>
                                </div>
                            `;
                            const container = document.getElementById('studentVideoContainer');
                            const localDiv = container.querySelector('.local-player');
                            const remoteDiv = container.querySelector('.remote-player');

                            const localVideo = document.createElement('video');
                            localVideo.srcObject = studentStream;
                            localVideo.autoplay = true;
                            localVideo.muted = true;
                            localVideo.style.width = '100%';
                            localVideo.style.height = '100%';
                            localVideo.style.objectFit = 'cover';
                            localDiv.appendChild(localVideo);

                            const remoteVideo = document.createElement('video');
                            remoteVideo.srcObject = remoteStream;
                            remoteVideo.autoplay = true;
                            remoteVideo.style.width = '100%';
                            remoteVideo.style.height = '100%';
                            remoteVideo.style.objectFit = 'cover';
                            remoteDiv.appendChild(remoteVideo);

                            db.ref('attendance/' + className + '/' + currentUser.uid).set({
                                joined: Date.now()
                            });

                            document.getElementById('leaveClassBtn').addEventListener('click', () => {
                                joinStudentClass(className);
                            });
                        });

                        call.on('close', () => {
                            liveContainer.innerHTML = '';
                            alert('Teacher ended the class.');
                            if (studentPeer) studentPeer.destroy();
                            studentPeer = null;
                            studentCall = null;
                        });
                    });

                    studentPeer.on('error', (err) => {
                        console.error('PeerJS error:', err);
                        alert('Error: ' + err.message);
                        if (studentPeer) studentPeer.destroy();
                        studentPeer = null;
                    });

                } catch (err) {
                    alert('Error joining class: ' + err.message);
                    console.error(err);
                }
            }
        }

        function renderStudentHomework() {
            dynamicContent.innerHTML = `
                <div class="page-content">
                    <h2>Homework</h2>
                    <div id="studentHomeworkList"></div>
                    <div class="card" style="margin-top:16px;">
                        <h3 style="font-size:17px;margin-bottom:10px;">📤 Submit Your Work</h3>
                        <input type="file" id="studentHwFile" accept="image/*" class="input-field" style="margin-bottom:10px;" />
                        <button id="submitHwBtn" class="btn btn-primary">Submit & Grade</button>
                        <div id="studentHwStatus" class="text-muted mt-10"></div>
                        <div id="studentHwResult" class="mt-10"></div>
                    </div>
                </div>
            `;

            const list = document.getElementById('studentHomeworkList');
            const fileInput = document.getElementById('studentHwFile');
            const submitBtn = document.getElementById('submitHwBtn');
            const status = document.getElementById('studentHwStatus');
            const resultDiv = document.getElementById('studentHwResult');

            const teacherEmail = 'nagrajmall2317@gmail.com';
            db.ref('users').once('value').then(snap => {
                if (snap.exists()) {
                    const users = snap.val();
                    let teacherUid = null;
                    for (const [uid, data] of Object.entries(users)) {
                        if (data.email === teacherEmail && data.role === 'teacher') {
                            teacherUid = uid;
                            break;
                        }
                    }
                    if (teacherUid) {
                        db.ref('homework/' + teacherUid).on('value', (snap2) => {
                            list.innerHTML = '';
                            if (snap2.exists()) {
                                const hws = snap2.val();
                                let html = '<div style="display:flex;flex-wrap:wrap;gap:12px;">';
                                Object.values(hws).forEach(hw => {
                                    html += `<div class="card" style="max-width:180px;">
                                        <img src="${hw.imageBase64}" style="max-width:100%;border-radius:8px;border:1px solid rgba(255,255,255,0.05);" />
                                        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px;">${new Date(hw.timestamp).toLocaleDateString()}</div>
                                    </div>`;
                                });
                                html += '</div>';
                                list.innerHTML = html;
                            } else {
                                list.innerHTML = '<div class="text-muted">No assignments posted.</div>';
                            }
                        });
                    }
                }
            });

            submitBtn.addEventListener('click', async () => {
                const file = fileInput.files[0];
                if (!file) { status.textContent = 'Select an image first.'; return; }
                status.textContent = '⏳ Processing...';
                try {
                    const reader = new FileReader();
                    const studentBase64 = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });

                    const teacherEmail = 'nagrajmall2317@gmail.com';
                    const usersSnap = await db.ref('users').once('value');
                    let teacherUid = null;
                    if (usersSnap.exists()) {
                        const users = usersSnap.val();
                        for (const [uid, data] of Object.entries(users)) {
                            if (data.email === teacherEmail && data.role === 'teacher') {
                                teacherUid = uid;
                                break;
                            }
                        }
                    }
                    if (!teacherUid) { status.textContent = 'Teacher not found.'; return; }

                    const hwSnap = await db.ref('homework/' + teacherUid).once('value');
                    if (!hwSnap.exists() || Object.keys(hwSnap.val()).length === 0) {
                        status.textContent = 'No assignment from teacher.';
                        return;
                    }
                    const hwKey = Object.keys(hwSnap.val())[0];
                    const teacherHw = hwSnap.val()[hwKey];
                    const teacherBase64 = teacherHw.imageBase64;

                    const similarity = await compareImagesBase64(teacherBase64, studentBase64);
                    const grade = Math.round((similarity / 100) * 5);
                    const finalGrade = Math.min(5, Math.max(1, grade));

                    await db.ref('homework/' + teacherUid + '/' + hwKey + '/submissions/' + currentUser.uid).set({
                        imageBase64: studentBase64,
                        similarity: similarity,
                        grade: finalGrade,
                        timestamp: Date.now()
                    });

                    status.textContent = '✅ Submitted! Grade: ' + finalGrade + '/5';
                    resultDiv.innerHTML = `
                        <div style="background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.1);border-radius:16px;padding:16px;text-align:center;">
                            <div style="font-size:14px;color:rgba(255,255,255,0.5);">Similarity: ${similarity.toFixed(1)}%</div>
                            <div style="font-size:42px;font-weight:700;color:#a78bfa;">${finalGrade} / 5</div>
                        </div>
                    `;
                } catch (err) {
                    status.textContent = '❌ Error: ' + err.message;
                    console.error(err);
                }
            });
        }
