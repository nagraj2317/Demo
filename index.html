<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Classroom · PeerJS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js">
    </script>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js">
    </script>

    <style>
        /* ===== FULL CSS (same as before – included in final code) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            min-height: 100vh;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1a1f2e;
            border-radius: 32px;
            padding: 30px 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .login-box h2 {
            font-size: 26px;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box input,
        .login-box select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            font-size: 14px;
        }
        .login-box input:focus,
        .login-box select:focus {
            border-color: rgba(167, 139, 250, 0.4);
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .login-box button:hover {
            transform: scale(1.02);
        }
        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
        }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
        }
        .toggle-link {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }
        .toggle-link span {
            color: #a78bfa;
            cursor: pointer;
        }
        .msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #f87171;
            min-height: 20px;
        }
        #appContainer {
            display: none;
            width: 100%;
            max-width: 1400px;
            height: 92vh;
            max-height: 900px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 60px 1fr 280px;
            grid-template-rows: 1fr;
            overflow: hidden;
        }
        .sidebar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }
        .sidebar .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            writing-mode: vertical-rl;
            padding: 2px 0;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar nav a {
            color: rgba(255, 255, 255, 0.35);
            font-size: 18px;
            padding: 10px;
            border-radius: 14px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s;
        }
        .sidebar nav a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
        }
        .sidebar nav a.active {
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.15);
        }
        .sidebar .bottom {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar .bottom a {
            color: rgba(255, 255, 255, 0.25);
            font-size: 16px;
            padding: 8px;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .sidebar .bottom a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        .main-area {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-width: 0;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .top-bar .page-title h2 {
            font-weight: 600;
            font-size: 18px;
            color: #f1f5f9;
        }
        .top-bar .page-title p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }
        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar .actions .pill {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-bar .actions .pill i {
            color: #34d399;
            font-size: 7px;
        }
        .top-bar .actions .avatar-group {
            display: flex;
            align-items: center;
        }
        .top-bar .actions .avatar-group .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            border: 2px solid rgba(15, 23, 42, 0.6);
            cursor: pointer;
        }
        .video-wrapper {
            flex: 1;
            min-height: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .video-wrapper #videoContainer {
            width: 100%;
            height: 100%;
            background: #0a0f1a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
            position: relative;
        }
        .video-wrapper .remote-player {
            flex: 1 1 40%;
            min-width: 160px;
            height: 55%;
            min-height: 120px;
            background: #1a1f2e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-wrapper .local-player {
            flex: 0 0 25%;
            min-width: 120px;
            height: 35%;
            min-height: 90px;
            background: #1a1f2e;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(167, 139, 250, 0.4);
            position: relative;
        }
        .video-overlay-badge {
            position: absolute;
            bottom: 12px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        .video-overlay-badge i {
            font-size: 7px;
        }
        .chat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 140px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 4px;
        }
        .chat-messages .msg {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 14px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .chat-messages .msg.teacher {
            background: rgba(167, 139, 250, 0.2);
            align-self: flex-end;
            color: #e2e8f0;
        }
        .chat-messages .msg.student {
            background: rgba(255, 255, 255, 0.06);
            align-self: flex-start;
            color: #cbd5e1;
        }
        .chat-messages .msg .sender {
            font-weight: 600;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            display: block;
        }
        .chat-input {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .chat-input input {
            flex: 1;
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            font-size: 12px;
        }
        .chat-input button {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .warning-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .warning-overlay.active {
            opacity: 1;
        }
        .warning-overlay .content {
            background: rgba(0, 0, 0, 0.8);
            padding: 24px 30px;
            border-radius: 28px;
            text-align: center;
            border: 2px solid #f87171;
        }
        .warning-overlay .content i {
            font-size: 48px;
            color: #f87171;
            display: block;
            margin-bottom: 8px;
        }
        .warning-overlay .content h2 {
            color: #f87171;
            font-size: 20px;
        }
        .warning-overlay .content p {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 6px;
            font-size: 14px;
        }
        .right-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            gap: 12px;
            overflow: hidden;
        }
        .right-panel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .right-panel .panel-header h4 {
            font-weight: 600;
            font-size: 13px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .right-panel .panel-header h4 i {
            color: #a78bfa;
        }
        .right-panel .panel-header .dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }
        .right-panel .placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            text-align: center;
        }
        .page-content {
            padding: 2px 0;
            flex: 1;
            overflow-y: auto;
        }
        .page-content h2 {
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-size: 13px;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
        }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 11px;
        }
        .input-field {
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 13px;
        }
        .input-field:focus {
            border-color: rgba(167, 139, 250, 0.3);
        }
        .flex-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .mb-10 {
            margin-bottom: 10px;
        }
        .text-muted {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
        }
        .class-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
        }
        .class-item .name {
            font-weight: 500;
        }
        .class-item .status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .class-item .status.active {
            color: #34d399;
        }
        .profile-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .profile-modal.active {
            display: flex;
        }
        .profile-box {
            background: #1a1f2e;
            border-radius: 28px;
            padding: 24px;
            max-width: 440px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .profile-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .profile-box h2 {
            font-size: 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-box h2 i {
            color: #a78bfa;
        }
        .profile-box .field {
            margin-bottom: 10px;
        }
        .profile-box .field label {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2px;
        }
        .profile-box .field .value {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            width: 100%;
            font-size: 13px;
        }
        .profile-box .field input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 13px;
        }
        .profile-box .field input:focus {
            border-color: rgba(167, 139, 250, 0.3);
        }
        @media (max-width: 860px) {
            #appContainer {
                grid-template-columns: 1fr;
                grid-template-rows: 50px 1fr auto;
                height: auto;
                border-radius: 20px;
                max-height: none;
            }
            .sidebar {
                flex-direction: row;
                padding: 4px 12px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                gap: 8px;
                overflow-x: auto;
                height: 50px;
            }
            .sidebar .brand {
                writing-mode: horizontal-tb;
                font-size: 14px;
                margin-right: auto;
                padding: 0;
            }
            .sidebar nav {
                flex-direction: row;
                gap: 4px;
            }
            .sidebar nav a {
                width: 32px;
                height: 32px;
                font-size: 14px;
                padding: 4px;
            }
            .sidebar .bottom {
                flex-direction: row;
                margin-top: 0;
                gap: 4px;
            }
            .sidebar .bottom a {
                width: 30px;
                height: 30px;
                font-size: 13px;
                padding: 4px;
            }
            .right-panel {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                max-height: 160px;
                padding: 10px 12px;
            }
            .main-area {
                padding: 10px 12px;
            }
            .video-wrapper {
                min-height: 180px;
            }
            .login-box {
                padding: 24px 18px;
                margin: 12px;
            }
            .chat-box {
                height: 110px;
            }
            .video-wrapper .remote-player {
                flex: 1 1 100%;
                height: 50%;
                min-height: 80px;
            }
            .video-wrapper .local-player {
                flex: 0 0 30%;
                min-width: 80px;
                height: 30%;
                min-height: 60px;
            }
            .profile-box {
                padding: 18px;
            }
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 18px 12px;
            }
            .login-box h2 {
                font-size: 22px;
            }
            .main-area {
                padding: 6px 8px;
            }
            .top-bar .page-title h2 {
                font-size: 16px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 14px;
            }
            .card {
                padding: 8px 10px;
            }
            .video-wrapper {
                min-height: 140px;
            }
            .video-wrapper .remote-player {
                height: 45%;
                min-height: 60px;
            }
            .video-wrapper .local-player {
                height: 25%;
                min-height: 50px;
            }
            .chat-box {
                height: 90px;
            }
            .profile-box {
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== WARNING OVERLAY ===== -->
    <div id="warningOverlay" class="warning-overlay">
        <div class="content">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>⚠️ ધ્યાન આપો!</h2>
            <p>તમારો ચહેરો કેમેરામાં દેખાતો નથી. કૃપા કરીને કેમેરા સામે બેસો.</p>
        </div>
    </div>

    <!-- ===== PROFILE MODAL ===== -->
    <div id="profileModal" class="profile-modal">
        <div class="profile-box">
            <button class="profile-close" id="profileClose">&times;</button>
            <h2><i class="fas fa-user-circle"></i> મારી પ્રોફાઇલ</h2>
            <div class="field">
                <label>ઇમેઇલ</label>
                <div class="value" id="profileEmail">-</div>
            </div>
            <div class="field">
                <label>પૂરું નામ</label>
                <input type="text" id="profileName" placeholder="તમારું પૂરું નામ" />
            </div>
            <div class="field">
                <label>મોબાઇલ નંબર</label>
                <input type="tel" id="profileMobile" placeholder="મોબાઇલ નંબર" />
            </div>
            <div class="field">
                <label>બ્રાન્ચ</label>
                <input type="text" id="profileBranch" placeholder="બ્રાન્ચ" />
            </div>
            <div class="field">
                <label>સેમેસ્ટર</label>

        // ================================================================

        function compareImagesBase64(base64_1, base64_2) {
            return new Promise((resolve) => {
                const img1 = new Image();
                const img2 = new Image();
                let loaded = 0;

                function checkDone() {
                    loaded++;
                    if (loaded === 2) {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const size = 80;
                        canvas.width = size;
                        canvas.height = size;
                        ctx.drawImage(img1, 0, 0, size, size);
                        const data1 = ctx.getImageData(0, 0, size, size).data;
                        ctx.drawImage(img2, 0, 0, size, size);
                        const data2 = ctx.getImageData(0, 0, size, size).data;
                        let mse = 0;
                        for (let i = 0; i < data1.length; i++) {
                            mse += (data1[i] - data2[i]) ** 2;
                        }
                        mse = mse / (data1.length);
                        const similarity = Math.max(0, (1 - Math.sqrt(mse) / 255) * 100);
                        resolve(similarity);
                    }
                }
                img1.onload = checkDone;
                img2.onload = checkDone;
                img1.onerror = () => { resolve(0); };
                img2.onerror = () => { resolve(0); };
                img1.src = base64_1;
                img2.src = base64_2;
            });
        }

                            });

                        document.querySelectorAll('.deleteClassBtn').forEach(btn => {
                            btn.addEventListener('click', async () => {
                                if (confirm('આ ક્લાસને રદ કરવો છે?')) {
                                    await classesRef.child(btn.dataset.key).remove();
                                }
                            });
                        });
                    } else {
                        classListContainer.innerHTML = '<div class="text-muted">હજી કોઈ ક્લાસ બનાવ્યો નથી.</div>';
                    }
                });
            }
            loadClasses();

            createBtn.addEventListener('click', async () => {
                const branch = newBranch.value.trim();
                const semester = parseInt(newSemester.value);
                const subject = newSubject.value.trim();
                let className = newClassName.value.trim();
                if (!branch || !semester || !subject || !className) {
                    alert('કૃપા કરીને બધી ફીલ્ડ ભરો.');
                    return;
                }
                className = className.replace(/\s+/g, '-');
                const snap = await classesRef.orderByChild('className').equalTo(className).once('value');
                if (snap.exists()) {
                    alert('આ નામ સાથેનો ક્લાસ પહેલેથી છે.');
                    return;
                }
                const newRef = classesRef.push();
                await newRef.set({
                    branch,
                    semester,
                    subject,
                    className,
                    teacher: currentUser.uid,
                    createdAt: Date.now(),
                    active: false
                });
                newClassName.value = '';
                newSubject.value = '';
            });

            async function switchCamera() {
                if (!localStream) return;
                const newFacing = cameraFacing === 'user' ? 'environment' : 'user';
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: newFacing },
                        audio: true
                    });
                    const videoTrack = newStream.getVideoTracks()[0];
                    const oldVideoTrack = localStream.getVideoTracks()[0];
                    localStream.removeTrack(oldVideoTrack);
                    localStream.addTrack(videoTrack);
                    oldVideoTrack.stop();
                    cameraFacing = newFacing;
                    const localVideo = document.querySelector('#teacherVideoContainer .local-player video');
                    if (localVideo) localVideo.srcObject = localStream;
                } catch (err) {
                    alert('કેમેરો બદલવામાં ભૂલ: ' + err.message);
                }
            }

            async function startClass(classKey, className) {
                if (isTeacherLive) {
                    await endClass(currentClassKey);
                }
                try {
                    if (peer) { peer.destroy();
                        peer = null; }
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    peer = new Peer(className, { debug: 2 });

                    peer.on('open', () => {
                        isTeacherLive = true;
                        currentClassKey = classKey;
                        classesRef.child(classKey).update({ active: true });
                        loadClasses();

                        liveContainer.innerHTML = `
                            <div class="card" style="margin-top:10px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                                    <h3 style="font-size:16px;">🟢 લાઈવ: ${className}</h3>
                                    <button id="switchCameraBtn" class="btn btn-sm btn-primary">🔄 કેમેરો બદલો</button>
                                </div>
                                <div class="video-wrapper" style="min-height:280px;position:relative;">
                                    <div id="teacherVideoContainer" style="width:100%;height:100%;background:#0a0f1a;display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto;position:relative;">
                                        <div class="local-player" style="flex:0 0 30%;min-width:120px;height:35%;min-height:80px;align-self:flex-start;"></div>
                                        <div id="studentListContainer" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:4px;background:rgba(0,0,0,0.2);border-radius:12px;min-height:100px;">
                                            <div style="color:rgba(255,255,255,0.3);font-size:12px;text-align:center;padding:8px;">કોઈ વિદ્યાર્થી જોડાયો નથી</div>
                                        </div>
                                    </div>
                                    <div class="video-overlay-badge">
                                        <i class="fas fa-circle" style="color:#34d399;"></i>
                                        <span>લાઈવ (શિક્ષક)</span>
                                    </div>
                                </div>
                                <div class="chat-box" style="margin-top:8px;height:120px;">
                                    <div class="chat-messages" id="teacher-chat-messages"></div>
                                    <div class="chat-input">
                                        <input type="text" id="teacher-chat-input" placeholder="જવાબ આપો..." />
                                        <button id="teacher-chat-send"><i class="fas fa-paper-plane"></i></button>
                                    </div>
                                </div>
                                <button id="stopLiveBtn" class="btn btn-danger" style="margin-top:8px;">ક્લાસ બંધ કરો</button>
                            </div>
                        `;

                        document.getElementById('switchCameraBtn').addEventListener('click', switchCamera);

                        // Local video
                        const videoContainer = document.getElementById('teacherVideoContainer');
                        const localDiv = videoContainer.querySelector('.local-player');
                        const localVideo = document.createElement('video');
                        localVideo.srcObject = localStream;
                        localVideo.autoplay = true;
                        localVideo.muted = true;
                        localVideo.style.width = '100%';
                        localVideo.style.height = '100%';
                        localVideo.style.objectFit = 'cover';
                        localDiv.appendChild(localVideo);

                        // Chat
                        const chatRef = db.ref('chat/' + className);
                        chatRef.on('child_added', (snap) => {
                            const data = snap.val();
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'msg ' + (data.role === 'teacher' ? 'teacher' : 'student');
                            msgDiv.innerHTML = `<span class="sender">${data.sender}</span> ${data.text}`;
                            const container = document.getElementById('teacher-chat-messages');
                            container.appendChild(msgDiv);
                            container.scrollTop = container.scrollHeight;
                        });

                        document.getElementById('teacher-chat-send').addEventListener('click', () => {
                            const input = document.getElementById('teacher-chat-input');
                            const text = input.value.trim();
                            if (!text) return;
                            chatRef.push({
                                sender: currentUser.email,
                                role: 'teacher',
                                text: text,
                                timestamp: Date.now()
                            });
                            input.value = '';
                        });

                        // Handle incoming student calls
                        peer.on('call', (call) => {
                            const studentId = call.peer;
                            if (studentCalls[studentId]) {
                                call.close();
                                return;
                            }
                            call.answer(localStream);
                            studentCalls[studentId] = { call, stream: null, videoOn: false, audioOn: false };

                            // Add student to list
                            const studentList = document.getElementById('studentListContainer');
                            const studentDiv = document.createElement('div');
                            studentDiv.id = 'student-' + studentId;
                            studentDiv.style.cssText =
                                'display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.05);';
                            studentDiv.innerHTML = `
                                <span style="font-size:13px;color:rgba(255,255,255,0.7);">${studentId}</span>
                                <div style="display:flex;gap:8px;">
                                    <button class="micToggleBtn" data-student="${studentId}" style="background:rgba(255,255,255,0.05);border:none;color:#f87171;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">
                                        <i class="fas fa-microphone-slash"></i>
                                    </button>
                                    <button class="videoToggleBtn" data-student="${studentId}" style="background:rgba(255,255,255,0.05);border:none;color:#f87171;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">
                                        <i class="fas fa-video-slash"></i>
                                    </button>
                                </div>
                            `;
                            const placeholder = studentList.querySelector('div[style]');
                            if (placeholder) placeholder.remove();
                            studentList.appendChild(studentDiv);

                            call.on('stream', (remoteStream) => {
                                studentCalls[studentId].stream = remoteStream;
                                remoteStream.getAudioTracks().forEach(t => t.enabled = false);
                                remoteStream.getVideoTracks().forEach(t => t.enabled = false);

                                const controlRef = db.ref(`classControl/${className}/students/${studentId}`);
                                controlRef.on('value', (snap) => {
                                    if (!snap.exists()) return;
                                    const data = snap.val();
                                    // Audio
                                    const audioOn = data.audio === true;
                                    remoteStream.getAudioTracks().forEach(t => t.enabled = audioOn);
                                    const micBtn = studentDiv.querySelector('.micToggleBtn');
                                    micBtn.style.color = audioOn ? '#34d399' : '#f87171';
                                    micBtn.innerHTML = audioOn ? '<i class="fas fa-microphone"></i>' :
                                        '<i class="fas fa-microphone-slash"></i>';
                                    // Video
                                    const videoOn = data.video === true;
                                    remoteStream.getVideoTracks().forEach(t => t.enabled = videoOn);
                                    const vidBtn = studentDiv.querySelector('.videoToggleBtn');
                                    vidBtn.style.color = videoOn ? '#34d399' : '#f87171';
                                    vidBtn.innerHTML = videoOn ? '<i class="fas fa-video"></i>' :
                                        '<i class="fas fa-video-slash"></i>';
                                    // Show/hide video
                                    let vidContainer = document.getElementById('vid-' + studentId);
                                    if (videoOn) {
                                        if (!vidContainer) {
                                            vidContainer = document.createElement('div');
                                            vidContainer.id = 'vid-' + studentId;
                                            vidContainer.style.cssText =
                                                'position:absolute;bottom:10px;right:10px;width:200px;height:150px;border-radius:12px;overflow:hidden;border:2px solid rgba(167,139,250,0.4);z-index:10;background:#1a1f2e;';
                                            document.getElementById('teacherVideoContainer').appendChild(
                                                vidContainer);
                                        }
                                        let vidEl = vidContainer.querySelector('video');
                                        if (!vidEl) {
                                            vidEl = document.createElement('video');
                                            vidEl.autoplay = true;
                                            vidEl.style.width = '100%';
                                            vidEl.style.height = '100%';
                                            vidEl.style.objectFit = 'cover';
                                            vidContainer.appendChild(vidEl);
                                        }
                                        vidEl.srcObject = remoteStream;
                                        vidContainer.style.display = 'block';
                                    } else {
                                        if (vidContainer) {
                                            vidContainer.style.display = 'none';
                                        }
                                    }
                                });
                            });

                            // Mic toggle
                            studentDiv.querySelector('.micToggleBtn').addEventListener('click', (e) => {
                                e.stopPropagation();
                                const student = e.currentTarget.dataset.student;
                                const ref = db.ref(`classControl/${className}/students/${student}/audio`);
                                ref.once('value').then(snap => {
                                    ref.set(!(snap.val() === true));
                                });
                            });

                            // Video toggle
                            studentDiv.querySelector('.videoToggleBtn').addEventListener('click', (e) => {
                                e.stopPropagation();
                                const student = e.currentTarget.dataset.student;
                                const ref = db.ref(`classControl/${className}/students/${student}/video`);
                                ref.once('value').then(snap => {
                                    ref.set(!(snap.val() === true));
                                });
                            });

                            call.on('close', () => {
                                delete studentCalls[studentId];
                                const el = document.getElementById('student-' + studentId);
                                if (el) el.remove();
                                const vidEl = document.getElementById('vid-' + studentId);
                                if (vidEl) vidEl.remove();
                                const studentList = document.getElementById('studentListContainer');
                                if (studentList.children.length === 0) {
                                    studentList.innerHTML =
                                        '<div style="color:rgba(255,255,255,0.3);font-size:12px;text-align:center;padding:8px;">કોઈ વિદ્યાર્થી જોડાયો નથી</div>';
                                }
                            });
                        });

                        document.getElementById('stopLiveBtn').addEventListener('click', () => {
                            endClass(classKey);
                        });
                    });

                    peer.on('error', (err) => {
                        alert('PeerJS ભૂલ: ' + err.message);
                        endClass(classKey);
                    });

                } catch (err) {
                    alert('ક્લાસ શરૂ કરવામાં ભૂલ: ' + err.message);
                }
            }

            async function endClass(classKey) {
                Object.values(studentCalls).forEach(({ call }) => call.close());
                studentCalls = {};
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
                isTeacherLive = false;
                liveContainer.innerHTML = '';
                await classesRef.child(classKey).update({ active: false });
                loadClasses();
                currentClassKey = null;
                await db.ref(`classControl/${currentClassKey}`).remove();
            }
        }

        function renderTeacherHomework() {
            dynamicContent.innerHTML = `
                <div class="page-content">
                    <h2>હોમવર્ક વ્યવસ્થાપન</h2>
                    <div class="card">
                        <h3 style="font-size:16px;margin-bottom:8px;">📤 નવું હોમવર્ક અપલોડ કરો</h3>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                            <input type="text" id="hwSubject" class="input-field" placeholder="વિષય" />
                            <input type="text" id="hwTopic" class="input-field" placeholder="ટોપિક" />
                            <input type="text" id="hwChapter" class="input-field" placeholder="પ્રકરણ" />
                            <input type="datetime-local" id="hwDueDate" class="input-field" />
                        </div>
                        <input type="file" id="hwTeacherFile" accept="image/*" class="input-field" style="margin-top:8px;" />
                        <button id="uploadHwBtn" class="btn btn-primary" style="margin-top:8px;">અપલોડ કરો</button>
                        <div id="hwUploadStatus" class="text-muted mt-10"></div>
                    </div>
                    <div id="hwSubmissions"></div>
                </div>
            `;
            const fileInput = document.getElementById('hwTeacherFile');
            const uploadBtn = document.getElementById('uploadHwBtn');
            const status = document.getElementById('hwUploadStatus');
            const subsDiv = document.getElementById('hwSubmissions');
            const subject = document.getElementById('hwSubject');
            const topic = document.getElementById('hwTopic');
            const chapter = document.getElementById('hwChapter');
            const dueDate = document.getElementById('hwDueDate');

            uploadBtn.addEventListener('click', async () => {
                const file = fileInput.files[0];
                const subj = subject.value.trim();
                const top = topic.value.trim();
                const chap = chapter.value.trim();
                const due = dueDate.value;
                if (!file || !subj || !top || !chap || !due) {
                    status.textContent = 'કૃપા કરીને બધી ફીલ્ડ ભરો અને ફોટો પસંદ કરો.';
                    return;
                }
                status.textContent = '⏳ કન્વર્ટ થઈ રહ્યું છે...';
                try {
                    const reader = new FileReader();
                    const base64 = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(base64));
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                    const hwRef = db.ref('homework/' + currentUser.uid).push();
                    await hwRef.set({
                        teacher: currentUser.uid,
                        subject: subj,
                        topic: top,
                        chapter: chap,
                        dueDate: due,
                        imageBase64: base64,
                        imageHash: hashHex,
                        timestamp: Date.now(),
                        branch: currentBranch || '',
                        semester: currentSemester || 0
                    });
                    status.textContent = '✅ હોમવર્ક અપલોડ થઈ ગયું!';
                    fileInput.value = '';
                    subject.value = '';
                    topic.value = '';
                    chapter.value = '';
                    dueDate.value = '';
                    loadSubmissions();
                } catch (err) {
                    status.textContent = '❌ ભૂલ: ' + err.message;
                }
            });

            function loadSubmissions() {
                db.ref('homework/' + currentUser.uid).on('value', (snap) => {
                    subsDiv.innerHTML = '';
                    if (snap.exists()) {
                        const data = snap.val();
                        let html = '<h3 style="font-size:16px;margin:12px 0 8px;">📋 બધા હોમવર્ક</h3>';
                        for (const [hwId, hw] of Object.entries(data)) {
                            html += `<div class="card">
                                <div><strong>${hw.subject}</strong> — ${hw.topic} (પ્રક. ${hw.chapter})</div>
                                <div style="font-size:12px;color:rgba(255,255,255,0.5);">છેલ્લી તારીખ: ${new Date(hw.dueDate).toLocaleString()}</div>
                                <div><strong>હોમવર્ક:</strong> <img src="${hw.imageBase64}" style="max-width:80px;max-height:80px;border-radius:6px;border:1px solid rgba(255,255,255,0.05);" /></div>
                                <div><strong>સબમિશન:</strong> ${hw.submissions ? Object.keys(hw.submissions).length : 0}</div>`;
                            if (hw.submissions) {
                                html += '<div style="margin-top:6px;">';
                                for (const [sid, sub] of Object.entries(hw.submissions)) {
                                    const sim = sub.similarity || 0;
                                    const grade = sub.grade || 'N/A';
                                    const warning = sim > 70 ? ' ⚠️ શક્ય નકલ' : '';
                                    html += `<div style="display:flex;gap:10px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px;flex-wrap:wrap;">
                                        <span style="color:rgba(255,255,255,0.5);">${sid}</span>
                                        <span style="color:#a78bfa;">ગ્રેડ: ${grade}</span>
                                        <span style="color:rgba(255,255,255,0.3);">સમાનતા: ${sim.toFixed(1)}%</span>
                                        ${warning}
                                        <img src="${sub.imageBase64}" style="max-width:30px;max-height:30px;border-radius:4px;border:1px solid rgba(255,255,255,0.05);" />
                                    </div>`;
                                }
                                html += '</div>';
                            }
                            html += '</div>';
                        }
                        subsDiv.innerHTML = html;
                    } else {
                        subsDiv.innerHTML = '<div class="text-muted">હજી કોઈ હોમવર્ક નથી.</div>';
                    }
                });
            }
            loadSubmissions();
        }

            let studentPeer = null;
            let studentCall = null;
            let studentStream = null;
            let faceDetector = null;
            let faceCheckInterval = null;
            let noFaceCount = 0;
            const warningOverlay = document.getElementById('warningOverlay');
            let sirenAudio = null;
            let audioCtx = null;
            let sirenTriggered = false;

            function resumeAudioContext() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {}
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function stopSiren() {
                if (sirenAudio) {
                    try {
                        sirenAudio.oscillator.stop();
                        sirenAudio.oscillator.disconnect();
                        sirenAudio.gainNode.disconnect();
                        if (audioCtx && audioCtx.state !== 'closed') {
                            audioCtx.close();
                        }
                    } catch (e) {}
                    sirenAudio = null;
                    audioCtx = null;
                }
                sirenTriggered = false;
            }

            function playSiren() {
                if (sirenAudio || sirenTriggered) return;
                resumeAudioContext();
                if (!audioCtx) return;
                try {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'sawtooth';
                    let freq = 200;
                    const startTime = audioCtx.currentTime;
                    oscillator.frequency.setValueAtTime(freq, startTime);
                    oscillator.frequency.linearRampToValueAtTime(600, startTime + 0.3);
                    oscillator.frequency.linearRampToValueAtTime(200, startTime + 0.6);
                    oscillator.frequency.linearRampToValueAtTime(600, startTime + 0.9);
                    oscillator.frequency.linearRampToValueAtTime(200, startTime + 1.2);
                    gainNode.gain.setValueAtTime(0.3, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 1.5);
                    oscillator.start(startTime);
                    oscillator.stop(startTime + 1.5);
                    sirenAudio = { oscillator, gainNode };
                    sirenTriggered = true;
                    setTimeout(() => {
                        if (sirenAudio) {
                            sirenAudio = null;
                            sirenTriggered = false;
                        }
                    }, 1600);
                } catch (e) {
                    console.warn('સાયરન સપોર્ટેડ નથી:', e);
                }
            }

            async function initFaceDetection(videoElement) {
                if (!window.FaceDetector) {
                    console.warn('FaceDetector સપોર્ટેડ નથી. ચહેરો ટ્રેકિંગ બંધ.');
                    return;
                }
                try {
                    faceDetector = new FaceDetector({
                        maxDetectedFaces: 1,
                        fastMode: true
                    });
                    faceCheckInterval = setInterval(async () => {
                        if (!videoElement || videoElement.readyState < 2) return;
                        try {
                            const faces = await faceDetector.detect(videoElement);
                            if (faces.length > 0) {
                                noFaceCount = 0;
                                warningOverlay.classList.remove('active');
                                if (sirenAudio) stopSiren();
                                sirenTriggered = false;
                            } else {
                                noFaceCount++;
                                if (noFaceCount > 5 && !sirenTriggered) {
                                    warningOverlay.classList.add('active');
                                    playSiren();
                                }
                            }
                        } catch (err) {
                            console.warn('ચહેરો શોધમાં ભૂલ:', err);
                        }
                    }, 1000);
                } catch (err) {
                    console.warn('FaceDetector ભૂલ:', err);
                }
            }

            function stopFaceDetection() {
                if (faceCheckInterval) {
                    clearInterval(faceCheckInterval);
                    faceCheckInterval = null;
                }
                if (faceDetector) {
                    faceDetector = null;
                }
                warningOverlay.classList.remove('active');
                stopSiren();
                noFaceCount = 0;
                sirenTriggered = false;
            }

            async function joinStudentClass(className) {
                if (studentCall) {
                    studentCall.close();
                    studentCall = null;
                    if (studentStream) {
                        studentStream.getTracks().forEach(t => t.stop());
                        studentStream = null;
                    }
                    if (studentPeer) {
                        studentPeer.destroy();
                        studentPeer = null;
                    }
                    liveContainer.innerHTML = '';
                    stopFaceDetection();
                    return;
                }

                try {
                    resumeAudioContext();

                    studentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    studentStream.getAudioTracks().forEach(t => t.enabled = false);

                    const randomId = 'student-' + Date.now();
                    studentPeer = new Peer(randomId, { debug: 2 });

                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => reject(new Error('Peer connection timeout')), 10000);
                        studentPeer.on('open', () => {
                            clearTimeout(timeout);
                            resolve();
                        });
                        studentPeer.on('error', reject);
                    });

                    const call = studentPeer.call(className, studentStream);
                    studentCall = call;

                    call.on('stream', (remoteStream) => {
                        liveContainer.innerHTML = `
                            <div class="card" style="margin-top:10px;">

                                <div class="chat-box" style="margin-top:8px;height:120px;">

                            </div>
                        `;

                        const videoContainer = document.getElementById('studentVideoContainer');
                        const remoteDiv = videoContainer.querySelector('.remote-player');
                        const localDiv = videoContainer.querySelector('.local-player');

                        // Remote (teacher) video
                        const remoteVideo = document.createElement('video');
                        remoteVideo.srcObject = remoteStream;
                        remoteVideo.autoplay = true;
                        remoteVideo.style.width = '100%';
                        remoteVideo.style.height = '100%';
                        remoteVideo.style.objectFit = 'cover';
                        remoteDiv.appendChild(remoteVideo);

                        // Local (student) video
                        const localVideo = document.createElement('video');
                        localVideo.srcObject = studentStream;
                        localVideo.autoplay = true;
                        localVideo.muted = true;
                        localVideo.style.width = '100%';
                        localVideo.style.height = '100%';
                        localVideo.style.objectFit = 'cover';
                        localDiv.appendChild(localVideo);

                        // Chat
                        const chatRef = db.ref('chat/' + className);
                        chatRef.on('child_added', (snap) => {
                            const data = snap.val();
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'msg ' + (data.role === 'teacher' ? 'teacher' :
                            'student');
                            msgDiv.innerHTML =
                                `<span class="sender">${data.sender}</span> ${data.text}`;
                            const container = document.getElementById('student-chat-messages');
                            container.appendChild(msgDiv);
                            container.scrollTop = container.scrollHeight;
                        });

                        document.getElementById('student-chat-send').addEventListener('click', () => {
                            const input = document.getElementById('student-chat-input');
                            const text = input.value.trim();
                            if (!text) return;
                            chatRef.push({
                                sender: currentUser.email,
                                role: 'student',
                                text: text,
                                timestamp: Date.now()
                            });
                            input.value = '';
                        });

                        document.getElementById('leaveClassBtn').addEventListener('click', () => {
                            joinStudentClass(className);
                        });

                        db.ref('attendance/' + className + '/' + currentUser.uid).set({
                            joined: Date.now()
                        });

                        // Start face detection on local video
                        initFaceDetection(localVideo);

                        // Listen for teacher's unmute command
                        const controlRef = db.ref(`classControl/${className}/students/${currentUser.email}/audio`);
                        controlRef.on('value', (snap) => {
                            const audioOn = snap.val() === true;
                            if (studentStream) {
                                studentStream.getAudioTracks().forEach(t => t.enabled = audioOn);
                            }
                        });
                    });

                    call.on('close', () => {
                        liveContainer.innerHTML = '';
                        stopFaceDetection();
                        if (studentPeer) studentPeer.destroy();
                        studentPeer = null;
                        studentCall = null;
                        const controlRef = db.ref(`classControl/${className}/students/${currentUser.email}/audio`);
                        controlRef.off();
                    });

                    call.on('error', (err) => {
                        alert('❌ કનેક્શન ભૂલ: ' + err.message);
                        stopFaceDetection();
                        if (studentPeer) studentPeer.destroy();
                        studentPeer = null;
                        if (studentStream) {
                            studentStream.getTracks().forEach(t => t.stop());
                            studentStream = null;
                        }
                        liveContainer.innerHTML = '';
                    });

                } catch (err) {
                    alert('❌ જોડાવામાં ભૂલ: ' + err.message);
                    stopFaceDetection();
                    if (studentPeer) {
                        studentPeer.destroy();
                        studentPeer = null;
                    }
                    if (studentStream) {
                        studentStream.getTracks().forEach(t => t.stop());
                        studentStream = null;
                    }
                    liveContainer.innerHTML = '';
                }
            }

            window.addEventListener('beforeunload', () => {
                stopFaceDetection();
            });
        }

                `;

                const fileInput = document.getElementById('studentHwFile');
                const submitBtn = document.getElementById('submitHwBtn');
                const status = document.getElementById('studentHwStatus');
                const resultDiv = document.getElementById('studentHwResult');

                db.ref(`homework/${currentUser.uid}/submissions/${hwId}`).once('value').then(snap => {

                        const studentBase64 = await new Promise((resolve) => {
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(

                        await db.ref(`homework/${currentUser.uid}/submissions/${hwId}`).set({
                            imageBase64: studentBase64,
                            hash: hashHex,
                            similarity: similarity,
                            grade: finalGrade,
                            timestamp: Date.now()
                        });

                        await db.ref(`homework/${hw.teacher}/${hwId}/submissions/${currentUser.email}`).set({

                    }
                });
            }
        }
