        function renderStudentHomework() {
            dynamicContent.innerHTML = `
                <div class="page-content">
                    <h2>Homework</h2>
                    <div id="studentHomeworkList"></div>
                    <div id="studentHomeworkDetail" style="margin-top:12px;"></div>
                </div>
            `;

            const listDiv = document.getElementById('studentHomeworkList');
            const detailDiv = document.getElementById('studentHomeworkDetail');

            const teacherEmail = 'nagrajmall2317@gmail.com';
            db.ref('users').once('value').then(snap => {
                if (snap.exists()) {
                    const users = snap.val();
                    let teacherUid = null;
                    for (const [uid, data] of Object.entries(users)) {
                        if (data.email === teacherEmail && data.role === 'teacher') {
                            teacherUid = uid;
                            break;
                        }
                    }
                    if (teacherUid) {
                        db.ref('homework/' + teacherUid).on('value', (snap2) => {
                            listDiv.innerHTML = '';
                            if (snap2.exists()) {
                                const hws = snap2.val();
                                let html = '<div style="display:flex;flex-wrap:wrap;gap:10px;">';
                                for (const [hwId, hw] of Object.entries(hws)) {
                                    html += `
                                        <div class="card" style="cursor:pointer;max-width:200px;" data-hwid="${hwId}">
                                            <div><strong>${hw.subject}</strong></div>
                                            <div style="font-size:12px;">${hw.topic}</div>
                                            <div style="font-size:11px;color:rgba(255,255,255,0.4);">Ch. ${hw.chapter}</div>
                                            <div style="font-size:11px;color:rgba(255,255,255,0.4);">Due: ${new Date(hw.dueDate).toLocaleDateString()}</div>
                                            <button class="btn btn-primary btn-sm selectHwBtn" data-hwid="${hwId}">Select</button>
                                        </div>
                                    `;
                                }
                                html += '</div>';
                                listDiv.innerHTML = html;

                                document.querySelectorAll('.selectHwBtn').forEach(btn => {
                                    btn.addEventListener('click', (e) => {
                                        const hwId = btn.dataset.hwid;
                                        showHomeworkDetail(hwId, hws[hwId]);
                                    });
                                });
                            } else {
                                listDiv.innerHTML = '<div class="text-muted">No assignments posted.</div>';
                            }
                        });
                    }
                }
            });

            function showHomeworkDetail(hwId, hw) {
                detailDiv.innerHTML = `
                    <div class="card">
                        <h3 style="font-size:16px;">${hw.subject} — ${hw.topic}</h3>
                        <p style="font-size:13px;">Chapter: ${hw.chapter}</p>
                        <p style="font-size:13px;color:rgba(255,255,255,0.5);">Due: ${new Date(hw.dueDate).toLocaleString()}</p>
                        <div><strong>Assignment Image:</strong> <img src="${hw.imageBase64}" style="max-width:120px;max-height:120px;border-radius:6px;border:1px solid rgba(255,255,255,0.05);" /></div>
                        <div style="margin-top:10px;">
                            <h4 style="font-size:14px;">Submit Your Work</h4>
                            <input type="file" id="studentHwFile" accept="image/*" class="input-field" style="margin-bottom:6px;" />
                            <button id="submitHwBtn" class="btn btn-primary">Submit</button>
                            <div id="studentHwStatus" class="text-muted mt-10"></div>
                            <div id="studentHwResult" class="mt-10"></div>
                        </div>
                    </div>
                `;

                const fileInput = document.getElementById('studentHwFile');
                const submitBtn = document.getElementById('submitHwBtn');
                const status = document.getElementById('studentHwStatus');
                const resultDiv = document.getElementById('studentHwResult');

                db.ref(`homework/${currentUser.uid}/submissions/${hwId}`).once('value').then(snap => {
                    if (snap.exists()) {
                        status.textContent = '✅ You already submitted this assignment.';
                        status.style.color = '#34d399';
                        submitBtn.disabled = true;
                    }
                });

                submitBtn.addEventListener('click', async () => {
                    const file = fileInput.files[0];
                    if (!file) { status.textContent = 'Select an image first.'; return; }
                    const snap = await db.ref(`homework/${currentUser.uid}/submissions/${hwId}`).once(
                        'value');
                    if (snap.exists()) {
                        status.textContent = 'You already submitted this assignment.';
                        return;
                    }
                    status.textContent = '⏳ Processing...';
                    try {
                        const reader = new FileReader();
                        const studentBase64 = await new Promise((resolve) => {
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(file);
                        });
                        const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(
                            studentBase64));
                        const hashArray = Array.from(new Uint8Array(hashBuffer));
                        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                        const existing = await db.ref(`homework/${currentUser.uid}/submissions/${hwId}`)
                            .once('value');
                        if (existing.exists()) {
                            status.textContent = 'You already submitted this assignment.';
                            return;
                        }

                        const teacherBase64 = hw.imageBase64;
                        const similarity = await compareImagesBase64(teacherBase64, studentBase64);
                        let grade;
                        if (similarity >= 50) grade = 5;
                        else if (similarity >= 40) grade = 4;
                        else if (similarity >= 30) grade = 3;
                        else if (similarity >= 20) grade = 2;
                        else grade = 1;

                        const finalGrade = Math.min(5, Math.max(1, grade));

                        await db.ref(`homework/${currentUser.uid}/submissions/${hwId}`).set({
                            imageBase64: studentBase64,
                            hash: hashHex,
                            similarity: similarity,
                            grade: finalGrade,
                            timestamp: Date.now()
                        });

                        await db.ref(`homework/${hw.teacher}/${hwId}/submissions/${currentUser.email}`).set({
                            imageBase64: studentBase64,
                            hash: hashHex,
                            similarity: similarity,
                            grade: finalGrade,
                            timestamp: Date.now()
                        });

                        status.textContent = '✅ Submitted! Grade: ' + finalGrade + '/5';
                        resultDiv.innerHTML = `
                            <div style="background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.1);border-radius:14px;padding:14px;text-align:center;">
                                <div style="font-size:13px;color:rgba(255,255,255,0.5);">Similarity: ${similarity.toFixed(1)}%</div>
                                <div style="font-size:32px;font-weight:700;color:#a78bfa;">${finalGrade} / 5</div>
                                ${similarity > 70 ? '<div style="color:#f87171;margin-top:4px;font-size:12px;">⚠️ High similarity detected. Your submission may be flagged.</div>' : ''}
                            </div>
                        `;
                        submitBtn.disabled = true;
                    } catch (err) {
                        status.textContent = '❌ Error: ' + err.message;
                        console.error(err);
                    }
                });
            }
        }
