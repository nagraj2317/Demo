<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Classroom · Final</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js">
    </script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            min-height: 100vh;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1a1f2e;
            border-radius: 32px;
            padding: 30px 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .login-box h2 {
            font-size: 26px;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box input,
        .login-box select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            font-size: 14px;
        }
        .login-box input:focus,
        .login-box select:focus {
            border-color: rgba(167, 139, 250, 0.4);
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .login-box button:hover {
            transform: scale(1.02);
        }
        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
        }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
        }
        .toggle-link {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }
        .toggle-link span {
            color: #a78bfa;
            cursor: pointer;
        }
        .msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #f87171;
            min-height: 20px;
        }
        #appContainer {
            display: none;
            width: 100%;
            max-width: 1400px;
            height: 92vh;
            max-height: 900px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: 60px 1fr 280px;
            grid-template-rows: 1fr;
            overflow: hidden;
        }
        .sidebar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }
        .sidebar .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            writing-mode: vertical-rl;
            padding: 2px 0;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar nav a {
            color: rgba(255, 255, 255, 0.35);
            font-size: 18px;
            padding: 10px;
            border-radius: 14px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s;
        }
        .sidebar nav a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
        }
        .sidebar nav a.active {
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.15);
        }
        .sidebar .bottom {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar .bottom a {
            color: rgba(255, 255, 255, 0.25);
            font-size: 16px;
            padding: 8px;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .sidebar .bottom a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        .main-area {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-width: 0;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .top-bar .page-title h2 {
            font-weight: 600;
            font-size: 18px;
            color: #f1f5f9;
        }
        .top-bar .page-title p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }
        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar .actions .pill {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-bar .actions .pill i {
            color: #34d399;
            font-size: 7px;
        }
        .top-bar .actions .avatar-group {
            display: flex;
            align-items: center;
        }
        .top-bar .actions .avatar-group .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            border: 2px solid rgba(15, 23, 42, 0.6);
            cursor: pointer;
        }
        .video-wrapper {
            flex: 1;
            min-height: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .video-wrapper #videoContainer {
            width: 100%;
            height: 100%;
            background: #0a0f1a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
            position: relative;
        }
        .video-wrapper .remote-player {
            flex: 1 1 40%;
            min-width: 160px;
            height: 55%;
            min-height: 120px;
            background: #1a1f2e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-wrapper .local-player {
            flex: 0 0 25%;
            min-width: 120px;
            height: 35%;
            min-height: 90px;
            background: #1a1f2e;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(167, 139, 250, 0.4);
            position: relative;
        }
        .video-overlay-badge {
            position: absolute;
            bottom: 12px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        .video-overlay-badge i {
            font-size: 7px;
        }
        .chat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 140px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 4px;
        }
        .chat-messages .msg {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 14px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .chat-messages .msg.teacher {
            background: rgba(167, 139, 250, 0.2);
            align-self: flex-end;
            color: #e2e8f0;
        }
        .chat-messages .msg.student {
            background: rgba(255, 255, 255, 0.06);
            align-self: flex-start;
            color: #cbd5e1;
        }
        .chat-messages .msg .sender {
            font-weight: 600;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            display: block;
        }
        .chat-input {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .chat-input input {
            flex: 1;
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            font-size: 12px;
        }
        .chat-input button {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .right-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            gap: 12px;
            overflow: hidden;
        }
        .right-panel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .right-panel .panel-header h4 {
            font-weight: 600;
            font-size: 13px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .right-panel .panel-header h4 i {
            color: #a78bfa;
        }
        .right-panel .panel-header .dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }
        .right-panel .placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            text-align: center;
        }
        .page-content {
            padding: 2px 0;
            flex: 1;
            overflow-y: auto;
        }
        .page-content h2 {
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-size: 13px;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .btn-primary {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
        }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 11px;
        }
        .input-field {
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 13px;
        }
        .input-field:focus {
            border-color: rgba(167, 139, 250, 0.3);
        }
        .flex-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .mb-10 {
            margin-bottom: 10px;
        }
        .text-muted {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
        }
        .class-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
        }
        .class-item .name {
            font-weight: 500;
        }
        .class-item .status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .class-item .status.active {
            color: #34d399;
        }
        .profile-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .profile-modal.active {
            display: flex;
        }
        .profile-box {
            background: #1a1f2e;
            border-radius: 28px;
            padding: 24px;
            max-width: 440px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .profile-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .profile-box h2 {
            font-size: 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-box h2 i {
            color: #a78bfa;
        }
        .profile-box .field {
            margin-bottom: 10px;
        }
        .profile-box .field label {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2px;
        }
        .profile-box .field .value {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            width: 100%;
            font-size: 13px;
        }
        .profile-box .field input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 13px;
        }
        .profile-box .field input:focus {
            border-color: rgba(167, 139, 250, 0.3);
        }
        @media (max-width: 860px) {
            #appContainer {
                grid-template-columns: 1fr;
                grid-template-rows: 50px 1fr auto;
                height: auto;
                border-radius: 20px;
                max-height: none;
            }
            .sidebar {
                flex-direction: row;
                padding: 4px 12px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                gap: 8px;
                overflow-x: auto;
                height: 50px;
            }
            .sidebar .brand {
                writing-mode: horizontal-tb;
                font-size: 14px;
                margin-right: auto;
                padding: 0;
            }
            .sidebar nav {
                flex-direction: row;
                gap: 4px;
            }
            .sidebar nav a {
                width: 32px;
                height: 32px;
                font-size: 14px;
                padding: 4px;
            }
            .sidebar .bottom {
                flex-direction: row;
                margin-top: 0;
                gap: 4px;
            }
            .sidebar .bottom a {
                width: 30px;
                height: 30px;
                font-size: 13px;
                padding: 4px;
            }
            .right-panel {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                max-height: 160px;
                padding: 10px 12px;
            }
            .main-area {
                padding: 10px 12px;
            }
            .video-wrapper {
                min-height: 180px;
            }
            .login-box {
                padding: 24px 18px;
                margin: 12px;
            }
            .chat-box {
                height: 110px;
            }
            .video-wrapper .remote-player {
                flex: 1 1 100%;
                height: 50%;
                min-height: 80px;
            }
            .video-wrapper .local-player {
                flex: 0 0 30%;
                min-width: 80px;
                height: 30%;
                min-height: 60px;
            }
            .profile-box {
                padding: 18px;
            }
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 18px 12px;
            }
            .login-box h2 {
                font-size: 22px;
            }
            .main-area {
                padding: 6px 8px;
            }
            .top-bar .page-title h2 {
                font-size: 16px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 14px;
            }
            .card {
                padding: 8px 10px;
            }
            .video-wrapper {
                min-height: 140px;
            }
            .video-wrapper .remote-player {
                height: 45%;
                min-height: 60px;
            }
            .video-wrapper .local-player {
                height: 25%;
                min-height: 50px;
            }
            .chat-box {
                height: 90px;
            }
            .profile-box {
                padding: 14px;
            }
        }
        /* Toast notification for student face warning */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(248, 113, 113, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: none;
            max-width: 300px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ===== PROFILE MODAL ===== -->
    <div id="profileModal" class="profile-modal">
        <div class="profile-box">
            <button class="profile-close" id="profileClose">&times;</button>
            <h2><i class="fas fa-user-circle"></i> My Profile</h2>
            <div class="field">
                <label>Email</label>
                <div class="value" id="profileEmail">-</div>
            </div>
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="profileName" placeholder="Your full name" />
            </div>
            <div class="field">
                <label>Mobile Number</label>
                <input type="tel" id="profileMobile" placeholder="Mobile number" />
            </div>
            <div class="field">
                <label>Branch</label>
                <input type="text" id="profileBranch" placeholder="Branch" />
            </div>
            <div class="field">
                <label>Semester</label>
                <input type="number" id="profileSemester" placeholder="Semester" min="1" />
            </div>
            <div class="field">
                <label>New Password (leave blank to keep current)</label>
                <input type="password" id="profilePassword" placeholder="New password" />
            </div>
            <button class="btn btn-primary" id="profileSaveBtn">Save</button>
            <div id="profileMsg" class="msg mt-10" style="color:#34d399;"></div>
        </div>
    </div>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Smart Classroom</h2>
            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" />
                <input type="password" id="loginPassword" placeholder="Password" />
                <button class="btn-primary" id="loginBtn">Sign In</button>
                <div class="toggle-link">New user? <span id="showSignup">Create account</span></div>
                <div class="msg" id="loginMsg"></div>
            </div>
            <div id="signupForm" style="display:none;">
                <input type="email" id="signupEmail" placeholder="Email" />
                <input type="password" id="signupPassword" placeholder="Password (6+) " />
                <input type="text" id="signupName" placeholder="Full Name" />
                <input type="text" id="signupBranch" placeholder="Branch" />
                <input type="number" id="signupSemester" placeholder="Semester" min="1" />
                <select id="signupRole">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
                <button class="btn-success" id="signupBtn">Create Account</button>

        // ================================================================

        function compareImagesBase64(base64_1, base64_2) {
            return new Promise((resolve) => {
                const img1 = new Image();
                const img2 = new Image();
                let loaded = 0;

                function checkDone() {
                    loaded++;
                    if (loaded === 2) {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const size = 80;
                        canvas.width = size;
                        canvas.height = size;
                        ctx.drawImage(img1, 0, 0, size, size);
                        const data1 = ctx.getImageData(0, 0, size, size).data;
                        ctx.drawImage(img2, 0, 0, size, size);
                        const data2 = ctx.getImageData(0, 0, size, size).data;
                        let mse = 0;
                        for (let i = 0; i < data1.length; i++) {
                            mse += (data1[i] - data2[i]) ** 2;
                        }
                        mse = mse / (data1.length);
                        const similarity = Math.max(0, (1 - Math.sqrt(mse) / 255) * 100);
                        resolve(similarity);
                    }
                }
                img1.onload = checkDone;
                img2.onload = checkDone;
                img1.onerror = () => { resolve(0); };
                img2.onerror = () => { resolve(0); };
                img1.src = base64_1;
                img2.src = base64_2;
            });
        }

        function renderTeacherLive() {
            dynamicContent.innerHTML = `

            let peer = null;

            const classesRef = db.ref('classes');

            function loadClasses() {
                classesRef.on('value', (snap) => {
                    classListContainer.innerHTML = '';
                    if (snap.exists()) {
                        const classes = snap.val();
                        let html = '<div style="font-weight:500;margin-bottom:6px;">All Classes:</div>';
                        Object.keys(classes).forEach(key => {
                            const cls = classes[key];
                            const isActive = cls.active || false;
                            html += `
                                <div class="class-item" data-key="${key}">
                                    <span class="name">${cls.className} (${cls.branch}, Sem ${cls.semester}, ${cls.subject})</span>
                                    <span class="status ${isActive ? 'active' : ''}">${isActive ? '🟢 Live' : '🔴 Offline'}</span>
                                    <div>
                                        <button class="btn btn-success btn-sm startClassBtn" data-key="${key}" data-name="${cls.className}" ${isActive ? 'style="display:none;"' : ''}>Start</button>
                                        <button class="btn btn-danger btn-sm endClassBtn" data-key="${key}" data-name="${cls.className}" ${!isActive ? 'style="display:none;"' : ''}>End</button>
                                        <button class="btn btn-danger btn-sm deleteClassBtn" data-key="${key}" style="background:rgba(248,113,113,0.2);color:#f87171;border:1px solid rgba(248,113,113,0.2);">Delete</button>
                                    </div>
                                </div>
                            `;
                        });
                        classListContainer.innerHTML = html;

                        document.querySelectorAll('.startClassBtn').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const key = btn.dataset.key;
                                const name = btn.dataset.name;
                                startClass(key, name);
                            });
                        });
                        document.querySelectorAll('.endClassBtn').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const key = btn.dataset.key;
                                endClass(key);
                            });
                        });
                        document.querySelectorAll('.deleteClassBtn').forEach(btn => {
                            btn.addEventListener('click', async () => {
                                if (confirm('Delete this class?')) {
                                    await classesRef.child(btn.dataset.key).remove();
                                }
                            });
                        });
                    } else {
                        classListContainer.innerHTML = '<div class="text-muted">No classes created yet.</div>';
                    }
                });
            }
            loadClasses();

            createBtn.addEventListener('click', async () => {
                const branch = newBranch.value.trim();
                const semester = parseInt(newSemester.value);
                const subject = newSubject.value.trim();
                let className = newClassName.value.trim();
                if (!branch || !semester || !subject || !className) {
                    alert('Please fill all fields.');
                    return;
                }
                className = className.replace(/\s+/g, '-');
                const snap = await classesRef.orderByChild('className').equalTo(className).once('value');
                if (snap.exists()) {
                    alert('A class with this name already exists.');
                    return;
                }
                const newRef = classesRef.push();
                await newRef.set({
                    branch,
                    semester,
                    subject,
                    className,
                    teacher: currentUser.uid,
                    createdAt: Date.now(),
                    active: false
                });
                newClassName.value = '';
                newSubject.value = '';
            });

            async function switchCamera() {
                if (!localStream) return;
                const newFacing = cameraFacing === 'user' ? 'environment' : 'user';
                try {
                    localStream.getVideoTracks().forEach(t => t.stop());
                    const newStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: newFacing },
                        audio: true
                    });
                    const newVideoTrack = newStream.getVideoTracks()[0];
                    const oldVideoTrack = localStream.getVideoTracks()[0];
                    localStream.removeTrack(oldVideoTrack);
                    localStream.addTrack(newVideoTrack);
                    cameraFacing = newFacing;
                    const localVideo = document.querySelector('#teacherVideoContainer .local-player video');
                    if (localVideo) localVideo.srcObject = localStream;
                } catch (err) {
                    alert('Camera switch error: ' + err.message);
                }
            }

            async function startClass(classKey, className) {
                if (isTeacherLive) {
                    await endClass(currentClassKey);
                }
                try {
                    if (peer) { peer.destroy();
                        peer = null; }
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    peer = new Peer(className, { debug: 2 });

                    peer.on('open', () => {
                        isTeacherLive = true;
                        currentClassKey = classKey;
                        classesRef.child(classKey).update({ active: true });
                        loadClasses();

                        liveContainer.innerHTML = `

                                            <div style="color:rgba(255,255,255,0.3);font-size:11px;text-align:center;">Notifications</div>
                                        </div>
                                        <div id="studentListContainer" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:4px;background:rgba(0,0,0,0.2);border-radius:12px;min-height:100px;">
                                            <div style="color:rgba(255,255,255,0.3);font-size:12px;text-align:center;padding:8px;">No students connected</div>
                                        </div>
                                    </div>
                                    <div class="video-overlay-badge">
                                        <i class="fas fa-circle" style="color:#34d399;"></i>
                                        <span>Live (Teacher)</span>
                                    </div>
                                </div>
                                <div class="chat-box" style="margin-top:8px;height:120px;">
                                    <div class="chat-messages" id="teacher-chat-messages"></div>
                                    <div class="chat-input">
                                        <input type="text" id="teacher-chat-input" placeholder="Reply..." />
                                        <button id="teacher-chat-send"><i class="fas fa-paper-plane"></i></button>
                                    </div>
                                </div>
                                <button id="stopLiveBtn" class="btn btn-danger" style="margin-top:8px;">End Class</button>
                            </div>
                        `;

                        document.getElementById('switchCameraBtn').addEventListener('click', switchCamera);

                        // Local video
                        const videoContainer = document.getElementById('teacherVideoContainer');
                        const localDiv = videoContainer.querySelector('.local-player');
                        const localVideo = document.createElement('video');
                        localVideo.srcObject = localStream;
                        localVideo.autoplay = true;
                        localVideo.muted = true;
                        localVideo.style.width = '100%';
                        localVideo.style.height = '100%';
                        localVideo.style.objectFit = 'cover';
                        localDiv.appendChild(localVideo);

                        // Chat
                        const chatRef = db.ref('chat/' + className);
                        chatRef.on('child_added', (snap) => {
                            const data = snap.val();
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'msg ' + (data.role === 'teacher' ? 'teacher' : 'student');
                            msgDiv.innerHTML = `<span class="sender">${data.sender}</span> ${data.text}`;
                            const container = document.getElementById('teacher-chat-messages');
                            container.appendChild(msgDiv);
                            container.scrollTop = container.scrollHeight;
                        });

                        document.getElementById('teacher-chat-send').addEventListener('click', () => {
                            const input = document.getElementById('teacher-chat-input');
                            const text = input.value.trim();
                            if (!text) return;
                            chatRef.push({
                                sender: currentUser.email,
                                role: 'teacher',
                                text: text,
                                timestamp: Date.now()
                            });
                            input.value = '';
                        });

                        // Notification listener (for face detection)
                        if (notifRef) notifRef.off();
                        notifRef = db.ref(`notifications/${className}`);
                        notifRef.on('child_added', (snap) => {
                            const data = snap.val();
                            if (!data.seen) {
                                snap.ref.update({ seen: true });
                                const notifContainer = document.getElementById('notificationContainer');
                                if (notifContainer) {
                                    // Remove placeholder if exists
                                    const placeholder = notifContainer.querySelector('div[style]');
                                    if (placeholder && notifContainer.children.length === 1) {
                                        // Only placeholder, remove it
                                        notifContainer.innerHTML = '';
                                    }
                                    const notifDiv = document.createElement('div');
                                    notifDiv.style.cssText =
                                        'background:rgba(248,113,113,0.15);border:1px solid #f87171;border-radius:10px;padding:6px 10px;margin-bottom:4px;color:#f1f5f9;font-size:12px;display:flex;justify-content:space-between;align-items:center;';
                                    notifDiv.innerHTML = `
                                        <span style="color:#f87171;">⚠️</span>
                                        <span>${data.message}</span>
                                        <span style="font-size:10px;color:rgba(255,255,255,0.3);">${new Date(data.timestamp).toLocaleTimeString()}</span>
                                    `;
                                    notifContainer.prepend(notifDiv);
                                    // Keep only last 10
                                    while (notifContainer.children.length > 10) {
                                        notifContainer.removeChild(notifContainer.lastChild);
                                    }
                                }
                            }
                        });

                        // Handle incoming student calls
                        peer.on('call', (call) => {
                            const studentId = call.peer;
                            if (studentCalls[studentId]) {
                                call.close();
                                return;
                            }
                            call.answer(localStream);
                            studentCalls[studentId] = { call, stream: null, element: null };

                            // Get student name
                            db.ref('users').orderByChild('email').equalTo(studentId).once('value').then(snap => {
                                let displayName = studentId;
                                if (snap.exists()) {
                                    const users = snap.val();
                                    for (const key in users) {
                                        if (users[key].email === studentId) {
                                            displayName = users[key].name || studentId;
                                            break;
                                        }
                                    }
                                }
                                const studentList = document.getElementById('studentListContainer');
                                // Remove placeholder if any
                                const placeholder = studentList.querySelector('div[style]');
                                if (placeholder) placeholder.remove();

                                const studentDiv = document.createElement('div');
                                studentDiv.id = 'student-' + studentId;
                                studentDiv.className = 'student-item';
                                studentDiv.style.cssText =
                                    'display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.05);margin-bottom:4px;';
                                studentDiv.innerHTML = `
                                    <span style="font-size:13px;color:rgba(255,255,255,0.7);">${displayName}</span>
                                    <div style="display:flex;gap:8px;">
                                        <button class="micToggleBtn" data-student="${studentId}" data-class="${className}" style="background:rgba(255,255,255,0.05);border:none;color:#f87171;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">
                                            <i class="fas fa-microphone-slash"></i>
                                        </button>
                                        <button class="videoToggleBtn" data-student="${studentId}" data-class="${className}" style="background:rgba(255,255,255,0.05);border:none;color:#f87171;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">
                                            <i class="fas fa-video-slash"></i>
                                        </button>
                                    </div>
                                `;
                                studentList.appendChild(studentDiv);
                                studentCalls[studentId].element = studentDiv;
                                updateStudentCount();

                                // Attach event listeners for mic and video
                                const micBtn = studentDiv.querySelector('.micToggleBtn');
                                const vidBtn = studentDiv.querySelector('.videoToggleBtn');

                                micBtn.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    const student = this.dataset.student;
                                    const cls = this.dataset.class;
                                    const ref = db.ref(`classControl/${cls}/students/${student}/audio`);
                                    ref.once('value').then(snap => {
                                        ref.set(!(snap.val() === true));
                                    });
                                });

                                vidBtn.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    const student = this.dataset.student;
                                    const cls = this.dataset.class;
                                    const ref = db.ref(`classControl/${cls}/students/${student}/video`);
                                    ref.once('value').then(snap => {
                                        ref.set(!(snap.val() === true));
                                    });
                                });

                                // Stream handling
                                call.on('stream', (remoteStream) => {
                                    studentCalls[studentId].stream = remoteStream;
                                    remoteStream.getAudioTracks().forEach(t => t.enabled = false);
                                    remoteStream.getVideoTracks().forEach(t => t.enabled = false);

                                    const controlRef = db.ref(`classControl/${className}/students/${studentId}`);
                                    controlRef.on('value', (snap) => {
                                        if (!snap.exists()) return;
                                        const data = snap.val();
                                        // Audio
                                        const audioOn = data.audio === true;
                                        remoteStream.getAudioTracks().forEach(t => t.enabled = audioOn);
                                        const micBtn = studentDiv.querySelector('.micToggleBtn');
                                        if (audioOn) {
                                            micBtn.style.color = '#34d399';
                                            micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                                        } else {
                                            micBtn.style.color = '#f87171';
                                            micBtn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                                        }
                                        // Video
                                        const videoOn = data.video === true;
                                        remoteStream.getVideoTracks().forEach(t => t.enabled = videoOn);
                                        const vidBtn = studentDiv.querySelector('.videoToggleBtn');
                                        if (videoOn) {
                                            vidBtn.style.color = '#34d399';
                                            vidBtn.innerHTML = '<i class="fas fa-video"></i>';
                                        } else {
                                            vidBtn.style.color = '#f87171';
                                            vidBtn.innerHTML = '<i class="fas fa-video-slash"></i>';
                                        }
                                        // Show video under name
                                        let vidContainer = document.getElementById('vid-' + studentId);
                                        if (videoOn) {
                                            if (!vidContainer) {
                                                vidContainer = document.createElement('div');
                                                vidContainer.id = 'vid-' + studentId;
                                                vidContainer.style.cssText =
                                                    'width:100%;max-width:200px;height:150px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);margin-top:4px;background:#0a0f1a;';
                                                studentDiv.appendChild(vidContainer);
                                            }
                                            let vidEl = vidContainer.querySelector('video');
                                            if (!vidEl) {
                                                vidEl = document.createElement('video');
                                                vidEl.autoplay = true;
                                                vidEl.style.width = '100%';
                                                vidEl.style.height = '100%';
                                                vidEl.style.objectFit = 'cover';
                                                vidContainer.appendChild(vidEl);
                                            }
                                            vidEl.srcObject = remoteStream;
                                            vidContainer.style.display = 'block';
                                        } else {
                                            if (vidContainer) {
                                                vidContainer.style.display = 'none';
                                            }
                                        }
                                    });
                                });

                                call.on('close', () => {
                                    const el = document.getElementById('student-' + studentId);
                                    if (el) el.remove();
                                    delete studentCalls[studentId];
                                    updateStudentCount();
                                    const vidCont = document.getElementById('vid-' + studentId);
                                    if (vidCont) vidCont.remove();
                                    const studentList = document.getElementById('studentListContainer');
                                    if (studentList.children.length === 0) {
                                        studentList.innerHTML =
                                            '<div style="color:rgba(255,255,255,0.3);font-size:12px;text-align:center;padding:8px;">No students connected</div>';
                                    }
                                });
                            });
                        });

                        document.getElementById('stopLiveBtn').addEventListener('click', () => {
                            endClass(classKey);
                        });

                        function updateStudentCount() {
                            const container = document.getElementById('studentListContainer');
                            const count = container.querySelectorAll('.student-item').length;
                            let header = document.querySelector('.student-count');
                            if (header) {
                                header.textContent = `Students: ${count}`;
                            } else {
                                const h = document.createElement('div');
                                h.className = 'student-count';
                                h.style.cssText =
                                    'font-weight:600;font-size:14px;padding:4px 8px;color:rgba(255,255,255,0.6);';
                                h.textContent = `Students: ${count}`;
                                container.prepend(h);
                            }
                        }
                    });

                    peer.on('error', (err) => {
                        alert('PeerJS error: ' + err.message);
                        endClass(classKey);
                    });

                } catch (err) {
                    alert('Error starting class: ' + err.message);
                }
            }

            async function endClass(classKey) {
                Object.values(studentCalls).forEach(({ call }) => {
                    if (call) call.close();
                });
                studentCalls = {};
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
                if (notifRef) {
                    notifRef.off();
                    notifRef = null;
                }
                isTeacherLive = false;
                liveContainer.innerHTML = '';
                await classesRef.child(classKey).update({ active: false });
                loadClasses();
                currentClassKey = null;
                if (currentClassKey) {
                    await db.ref(`classControl/${currentClassKey}`).remove();
                }
            }
        }

        function renderTeacherHomework() {
            dynamicContent.innerHTML = `
                <div class="page-content">
                    <h2>Homework Management</h2>
                    <div class="card">
                        <h3 style="font-size:16px;margin-bottom:8px;">📤 Upload New Assignment</h3>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                            <input type="text" id="hwSubject" class="input-field" placeholder="Subject" />
                            <input type="text" id="hwTopic" class="input-field" placeholder="Topic" />
                            <input type="text" id="hwChapter" class="input-field" placeholder="Chapter" />
                            <input type="datetime-local" id="hwDueDate" class="input-field" />
                        </div>
                        <input type="file" id="hwTeacherFile" accept="image/*" class="input-field" style="margin-top:8px;" />
                        <button id="uploadHwBtn" class="btn btn-primary" style="margin-top:8px;">Upload Assignment</button>
                        <div id="hwUploadStatus" class="text-muted mt-10"></div>
                    </div>
                    <div id="hwSubmissions"></div>
                </div>
            `;
            const fileInput = document.getElementById('hwTeacherFile');
            const uploadBtn = document.getElementById('uploadHwBtn');
            const status = document.getElementById('hwUploadStatus');
            const subsDiv = document.getElementById('hwSubmissions');
            const subject = document.getElementById('hwSubject');
            const topic = document.getElementById('hwTopic');
            const chapter = document.getElementById('hwChapter');
            const dueDate = document.getElementById('hwDueDate');

            uploadBtn.addEventListener('click', async () => {
                const file = fileInput.files[0];
                const subj = subject.value.trim();
                const top = topic.value.trim();
                const chap = chapter.value.trim();
                const due = dueDate.value;
                if (!file || !subj || !top || !chap || !due) {
                    status.textContent = 'Please fill all fields and select an image.';
                    return;
                }
                status.textContent = '⏳ Converting...';
                try {
                    const reader = new FileReader();
                    const base64 = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(base64));
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                    const hwRef = db.ref('homework/' + currentUser.uid).push();
                    await hwRef.set({
                        teacher: currentUser.uid,
                        subject: subj,
                        topic: top,
                        chapter: chap,
                        dueDate: due,
                        imageBase64: base64,
                        imageHash: hashHex,
                        timestamp: Date.now(),
                        branch: currentBranch || '',
                        semester: currentSemester || 0
                    });
                    status.textContent = '✅ Assignment uploaded!';
                    fileInput.value = '';
                    subject.value = '';
                    topic.value = '';
                    chapter.value = '';
                    dueDate.value = '';
                    loadSubmissions();
                } catch (err) {
                    status.textContent = '❌ Error: ' + err.message;
                }
            });

            function loadSubmissions() {
                db.ref('homework/' + currentUser.uid).on('value', (snap) => {
                    subsDiv.innerHTML = '';
                    if (snap.exists()) {
                        const data = snap.val();
                        let html = '<h3 style="font-size:16px;margin:12px 0 8px;">📋 All Assignments</h3>';
                        for (const [hwId, hw] of Object.entries(data)) {
                            html += `<div class="card">
                                <div><strong>${hw.subject}</strong> — ${hw.topic} (Ch. ${hw.chapter})</div>
                                <div style="font-size:12px;color:rgba(255,255,255,0.5);">Due: ${new Date(hw.dueDate).toLocaleString()}</div>
                                <div><strong>Assignment:</strong> <img src="${hw.imageBase64}" style="max-width:80px;max-height:80px;border-radius:6px;border:1px solid rgba(255,255,255,0.05);" /></div>
                                <div><strong>Submissions:</strong> ${hw.submissions ? Object.keys(hw.submissions).length : 0}</div>`;
                            if (hw.submissions) {
                                html += '<div style="margin-top:6px;">';
                                for (const [sid, sub] of Object.entries(hw.submissions)) {
                                    const sim = sub.similarity || 0;
                                    const grade = sub.grade || 'N/A';
                                    const warning = sim > 70 ? ' ⚠️ Possible Cheating' : '';
                                    html += `<div style="display:flex;gap:10px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px;flex-wrap:wrap;">
                                        <span style="color:rgba(255,255,255,0.5);">${sid}</span>
                                        <span style="color:#a78bfa;">Grade: ${grade}</span>
                                        <span style="color:rgba(255,255,255,0.3);">Sim: ${sim.toFixed(1)}%</span>
                                        ${warning}
                                        <img src="${sub.imageBase64}" style="max-width:30px;max-height:30px;border-radius:4px;border:1px solid rgba(255,255,255,0.05);" />
                                    </div>`;
                                }
                                html += '</div>';
                            }
                            html += '</div>';
                        }
                        subsDiv.innerHTML = html;
                    } else {
                        subsDiv.innerHTML = '<div class="text-muted">No assignments yet.</div>';
                    }
                });
            }
            loadSubmissions();
        }

                <div class="page-content">
                    <h2>Live Class</h2>

            `;
            const classListDiv = document.getElementById('studentClassList');
            const liveContainer = document.getElementById('studentLiveContainer');

            const userBranch = (currentBranch || '').trim().toLowerCase();
            const userSemester = currentSemester || 0;

            db.ref('classes').orderByChild('active').equalTo(true).on('value', (snap) => {
                classListDiv.innerHTML = '';
                if (snap.exists()) {
                    const classes = snap.val();
                    let found = false;
                    let html = '<div style="margin-bottom:10px;">Available Live Classes:</div>';

                    Object.keys(classes).forEach(key => {
                        const cls = classes[key];
                        const clsBranch = (cls.branch || '').trim().toLowerCase();
                        const clsSemester = cls.semester || 0;

                        if (clsBranch === userBranch && clsSemester === userSemester) {
                            found = true;
                            html += `
                                <div class="class-item" data-key="${key}">
                                    <span class="name">${cls.className} (${cls.subject})</span>
                                    <button class="btn btn-success btn-sm joinClassBtn" data-name="${cls.className}">Join</button>
                                </div>
                            `;
                        }
                    });

                    if (!found) {
                        html += `<div class="text-muted">No live classes for your branch & semester.</div>`;
                    }
                    classListDiv.innerHTML = html;

                    document.querySelectorAll('.joinClassBtn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const name = btn.dataset.name;
                            joinStudentClass(name);
                        });
                    });
                } else {
                    classListDiv.innerHTML = '<div class="text-muted">No live classes at the moment.</div>';
                }
            });

            let studentPeer = null;
            let studentCall = null;
            let studentStream = null;
            let faceDetector = null;
            let faceCheckInterval = null;
            let noFaceCount = 0;
            let notificationSent = false;
            let currentClassName = '';
            let toastTimeout = null;

            async function initFaceDetection(videoElement, className) {
                if (!window.FaceDetector) {
                    console.warn('FaceDetector not supported. Face tracking disabled.');
                    return;
                }
                currentClassName = className;
                try {
                    faceDetector = new FaceDetector({
                        maxDetectedFaces: 1,
                        fastMode: true
                    });
                    faceCheckInterval = setInterval(async () => {
                        if (!videoElement || videoElement.readyState < 2) return;
                        try {
                            const faces = await faceDetector.detect(videoElement);
                            if (faces.length > 0) {
                                noFaceCount = 0;
                                notificationSent = false;
                                // Hide toast if visible
                                toast.style.display = 'none';
                                if (toastTimeout) {
                                    clearTimeout(toastTimeout);
                                    toastTimeout = null;
                                }
                            } else {
                                noFaceCount++;
                                if (noFaceCount > 5 && !notificationSent) {
                                    notificationSent = true;
                                    // Send notification to teacher
                                    const notificationRef = db.ref(`notifications/${className}`);
                                    notificationRef.push({
                                        studentName: currentName || currentUser.email,
                                        studentEmail: currentUser.email,
                                        message: `${currentName || currentUser.email} is not visible on camera!`,
                                        timestamp: Date.now(),
                                        seen: false
                                    });
                                    // Show toast on student screen
                                    toast.textContent = '⚠️ Your face is not visible. Please sit in front of the camera.';
                                    toast.style.display = 'block';
                                    if (toastTimeout) clearTimeout(toastTimeout);
                                    toastTimeout = setTimeout(() => {
                                        toast.style.display = 'none';
                                    }, 5000);
                                }
                            }
                        } catch (err) {
                            console.warn('Face detection error:', err);
                        }
                    }, 1000);
                } catch (err) {
                    console.warn('FaceDetector error:', err);
                }
            }

            function stopFaceDetection() {
                if (faceCheckInterval) {
                    clearInterval(faceCheckInterval);
                    faceCheckInterval = null;
                }
                if (faceDetector) {
                    faceDetector = null;
                }
                noFaceCount = 0;
                notificationSent = false;
                toast.style.display = 'none';
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toastTimeout = null;
                }
            }

            async function joinStudentClass(className) {
                if (studentCall) {
                    studentCall.close();
                    studentCall = null;
                    if (studentStream) {
                        studentStream.getTracks().forEach(t => t.stop());
                        studentStream = null;
                    }
                    if (studentPeer) {
                        studentPeer.destroy();
                        studentPeer = null;
                    }
                    liveContainer.innerHTML = '';
                    stopFaceDetection();
                    return;
                }

                try {
                    studentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    studentStream.getAudioTracks().forEach(t => t.enabled = false);

                    const randomId = 'student-' + Date.now();
                    studentPeer = new Peer(randomId, { debug: 2 });

                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => reject(new Error('Peer connection timeout')), 10000);
                        studentPeer.on('open', () => {
                            clearTimeout(timeout);
                            resolve();
                        });
                        studentPeer.on('error', reject);
                    });

                    const call = studentPeer.call(className, studentStream);
                    studentCall = call;

                    call.on('stream', (remoteStream) => {
                        liveContainer.innerHTML = `
                            <div class="card" style="margin-top:10px;">
                                <h3 style="font-size:16px;margin-bottom:6px;">🟢 Joined: ${className}</h3>
                                <div class="video-wrapper" style="min-height:280px;position:relative;">
                                    <div id="studentVideoContainer" style="width:100%;height:100%;background:#0a0f1a;display:flex;flex-wrap:wrap;gap:8px;padding:8px;overflow-y:auto;position:relative;">
                                        <div class="remote-player" style="flex:2 1 60%;min-width:180px;height:60%;min-height:140px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);"></div>
                                        <div class="local-player" style="flex:0 0 25%;min-width:100px;height:30%;min-height:70px;border-radius:10px;overflow:hidden;border:2px solid rgba(167,139,250,0.4);"></div>
                                    </div>
                                    <div class="video-overlay-badge">
                                        <i class="fas fa-circle" style="color:#34d399;"></i>
                                        <span>Connected</span>
                                    </div>
                                </div>
                                <div class="chat-box" style="margin-top:8px;height:120px;">
                                    <div class="chat-messages" id="student-chat-messages"></div>
                                    <div class="chat-input">
                                        <input type="text" id="student-chat-input" placeholder="Ask question..." />
                                        <button id="student-chat-send"><i class="fas fa-paper-plane"></i></button>
                                    </div>
                                </div>
                                <button id="leaveClassBtn" class="btn btn-danger" style="margin-top:8px;">Leave Class</button>
                            </div>
                        `;

                        const videoContainer = document.getElementById('studentVideoContainer');
                        const remoteDiv = videoContainer.querySelector('.remote-player');
                        const localDiv = videoContainer.querySelector('.local-player');

                        // Remote (teacher) video
                        const remoteVideo = document.createElement('video');
                        remoteVideo.srcObject = remoteStream;
                        remoteVideo.autoplay = true;
                        remoteVideo.style.width = '100%';
                        remoteVideo.style.height = '100%';
                        remoteVideo.style.objectFit = 'cover';
                        remoteDiv.appendChild(remoteVideo);

                        // Local (student) video
                        const localVideo = document.createElement('video');
                        localVideo.srcObject = studentStream;
                        localVideo.autoplay = true;
                        localVideo.muted = true;
                        localVideo.style.width = '100%';
                        localVideo.style.height = '100%';
                        localVideo.style.objectFit = 'cover';
                        localDiv.appendChild(localVideo);

                        // Chat
                        const chatRef = db.ref('chat/' + className);
                        chatRef.on('child_added', (snap) => {
                            const data = snap.val();
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'msg ' + (data.role === 'teacher' ? 'teacher' :
                            'student');
                            msgDiv.innerHTML =
                                `<span class="sender">${data.sender}</span> ${data.text}`;
                            const container = document.getElementById('student-chat-messages');
                            container.appendChild(msgDiv);
                            container.scrollTop = container.scrollHeight;
                        });

                        document.getElementById('student-chat-send').addEventListener('click', () => {
                            const input = document.getElementById('student-chat-input');
                            const text = input.value.trim();
                            if (!text) return;
                            chatRef.push({
                                sender: currentUser.email,
                                role: 'student',
                                text: text,
                                timestamp: Date.now()
                            });
                            input.value = '';
                        });

                        document.getElementById('leaveClassBtn').addEventListener('click', () => {
                            joinStudentClass(className);
                        });

                        db.ref('attendance/' + className + '/' + currentUser.uid).set({
                            joined: Date.now()
                        });

                        initFaceDetection(localVideo, className);

                        const controlRef = db.ref(`classControl/${className}/students/${currentUser.email}/audio`);
                        controlRef.on('value', (snap) => {
                            const audioOn = snap.val() === true;
                            if (studentStream) {
                                studentStream.getAudioTracks().forEach(t => t.enabled = audioOn);
                            }
                        });
                    });

                    call.on('close', () => {
                        liveContainer.innerHTML = '';
                        stopFaceDetection();
                        if (studentPeer) studentPeer.destroy();
                        studentPeer = null;
                        studentCall = null;
                        const controlRef = db.ref(`classControl/${className}/students/${currentUser.email}/audio`);
                        controlRef.off();
                    });

                    call.on('error', (err) => {
                        alert('❌ Connection error: ' + err.message);
                        stopFaceDetection();
                        if (studentPeer) studentPeer.destroy();
                        studentPeer = null;
                        if (studentStream) {
                            studentStream.getTracks().forEach(t => t.stop());
                            studentStream = null;
                        }
                        liveContainer.innerHTML = '';
                    });

                } catch (err) {
                    alert('❌ Join error: ' + err.message);
                    stopFaceDetection();
                    if (studentPeer) {
                        studentPeer.destroy();
                        studentPeer = null;
                    }
                    if (studentStream) {
                        studentStream.getTracks().forEach(t => t.stop());
                        studentStream = null;
                    }
                    liveContainer.innerHTML = '';
                }
            }

            window.addEventListener('beforeunload', () => {
                stopFaceDetection();
            });
        }
